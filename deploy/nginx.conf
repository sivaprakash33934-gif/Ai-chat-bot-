server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --------------------------------------------------------------------------
    # Security Headers (Master Blueprint §10.2 Sovereignty Guarantee)
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self';" always;

    # --------------------------------------------------------------------------
    # Compression Engine
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # --------------------------------------------------------------------------
    # Machine Discovery Manifests (llms.txt, robots.txt, sitemap.xml)
    # --------------------------------------------------------------------------
    location = /llms.txt {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=43200";
    }

    location = /robots.txt {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /sitemap.xml {
        default_type application/xml;
        charset utf-8;
        add_header Cache-Control "public, max-age=86400";
    }

    # --------------------------------------------------------------------------
    # Next.js Static Cache Optimization (Immutable Hashes)
    # --------------------------------------------------------------------------
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Static Route Routing & 404 Interception
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri.html $uri/ /index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
